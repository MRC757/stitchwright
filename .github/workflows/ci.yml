name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    # Windows: some tests open small Tk windows and the text tests need fonts (Arial).
    # The oldest and newest supported Pythons, and the one the Windows app is built with.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: pyflakes
        run: python -m pyflakes stitchwright tests
      - name: Tests
        run: python -m pytest -q

  build-exe:
    # on version tags (v0.2.2, ...): build the Windows app and publish it as a GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # to create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        shell: pwsh
        run: |
          $v = python -c "import stitchwright; print(stitchwright.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match version $v in stitchwright/__init__.py" }
      - name: Build stitchwright.exe
        shell: pwsh
        run: ./build_exe.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: stitchwright-exe
          path: dist/stitchwright.exe
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/stitchwright.exe --title "Stitchwright ${{ github.ref_name }}" --notes "Windows app: download stitchwright.exe below and double-click it. See CHANGELOG.md for what changed." --verify-tag
